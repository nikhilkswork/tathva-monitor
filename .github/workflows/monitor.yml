name: Tathva Workshop Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tathva-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Tathva
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Save updated workshop IDs
        run: |
          git config user.name "Tathva Monitor Bot"
          git config user.email "tathva-monitor@users.noreply.github.com"

          git add known_workshops.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update known Tathva workshops"
            git push
          fi
