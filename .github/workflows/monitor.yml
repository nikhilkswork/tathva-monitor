name: HackRadar Hackathon Monitor

on:
  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hackradar-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HackRadar Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: sqlite:///hackradar.db
        run: |
          python -m app.monitor

      - name: Persist SQLite Database & State
        run: |
          git config user.name "HackRadar Monitor Bot"
          git config user.email "hackradar-bot@users.noreply.github.com"

          # Stage database and tracked files
          git add hackradar.db known_workshops.json

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(db): update HackRadar discovered events state [skip ci]"
            git push
          fi
